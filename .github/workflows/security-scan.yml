name: Security Scan

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@v3.88.18
        with:
          path: ./
          extra_args: --only-verified

  checkov-manifests:
    name: Checkov Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov K8s Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: gitops/
          framework: kubernetes
          output_format: cli
          soft_fail: true
