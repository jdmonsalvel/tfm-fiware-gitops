apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiware-kong
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.konghq.com
    chart: kong
    targetRevision: "3.2.0"
    helm:
      values: |
        image:
          repository: kong
          tag: "3.9"

        env:
          database: "off"
          nginx_worker_processes: "1"
          # El post-function consulta el TIL por HTTP desde el sandbox de Lua.
          untrusted_lua_sandbox_requires: "resty.http"

        dblessConfig:
          config: |
            _format_version: "3.0"
            _transform: true
            services:
              - name: orion-ld-service
                url: http://fiware-orion.provider.svc.cluster.local:1026
                connect_timeout: 10000
                read_timeout: 60000
                write_timeout: 60000
                routes:
                  - name: ngsi-ld-api
                    paths:
                      - /ngsi-ld
                      - /version
                    strip_path: false
                    preserve_host: true
            consumers:
              - username: fiware-dataspace-provider
                jwt_secrets:
                  - algorithm: HS256
                    key: fiware-dataspace-provider-app
                    secret: demo-jwt-secret-tfm-2026
              # Firma válida pero emisor no registrado en el TIL (escenario 403).
              - username: unregistered-participant
                jwt_secrets:
                  - algorithm: HS256
                    key: unregistered-participant-app
                    secret: demo-unregistered-secret-tfm-2026
            plugins:
              - name: jwt
                service: orion-ld-service
                config:
                  key_claim_name: iss
                  claims_to_verify:
                    - exp
              # Corre tras el jwt: solo pasan a Orion los emisores presentes en el TIL.
              - name: post-function
                service: orion-ld-service
                config:
                  access:
                    - |
                      local cred = kong.client.get_credential()
                      if not cred then
                        return kong.response.exit(401, { message = "Unauthorized" })
                      end
                      local httpc = require("resty.http").new()
                      httpc:set_timeout(3000)
                      local res, err = httpc:request_uri(
                        "http://fiware-til-trusted-issuers-list.trust-anchor.svc.cluster.local:8080/issuer/" .. cred.key)
                      if not res then
                        kong.log.err("TIL no disponible: ", err)
                        return kong.response.exit(503, { message = "Trusted Issuers List unavailable" })
                      end
                      if res.status ~= 200 then
                        return kong.response.exit(403, { message = "Forbidden: issuer not registered in Trusted Issuers List" })
                      end

        ingressController:
          enabled: false

        proxy:
          enabled: true
          type: ClusterIP
          ingress:
            enabled: false
            ingressClassName: nginx
            hostname: orion.lab-jdmonsalvel.com
            path: /
            pathType: Prefix
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            tls: orion-tls

        admin:
          enabled: false

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: provider
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
