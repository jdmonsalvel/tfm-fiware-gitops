# Orion-LD — Context Broker NGSI-LD
broker:
  envPrefix: ORIONLD_
  port: 1026
  db:
    hosts:
      - fiware-orion-mongo
    name: orion
    mongocOnly: true

# Ingress deshabilitado: Kong (wave 3) actúa como único punto de entrada público.
# El acceso a Orion es exclusivamente interno: fiware-orion.provider.svc.cluster.local:1026
ingress:
  enabled: false

deployment:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
