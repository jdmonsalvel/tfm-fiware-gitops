# Orion-LD — Context Broker NGSI-LD
broker:
  envPrefix: ORIONLD_
  port: 1026
  db:
    hosts:
      - fiware-orion-mongo
    name: orion
    mongocOnly: true

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: orion.lab-jdmonsalvel.com
      paths:
        - /
  tls:
    - secretName: orion-tls
      hosts:
        - orion.lab-jdmonsalvel.com

deployment:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
