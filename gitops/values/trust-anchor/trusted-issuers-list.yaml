# Trusted Issuers List — registro de emisores de Verifiable Credentials
database:
  persistence: false

ingress:
  til:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: til.lab-jdmonsalvel.com
    tls:
      - secretName: til-tls
        hosts:
          - til.lab-jdmonsalvel.com
  tir:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: tir.lab-jdmonsalvel.com
    tls:
      - secretName: tir-tls
        hosts:
          - tir.lab-jdmonsalvel.com

deployment:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m
